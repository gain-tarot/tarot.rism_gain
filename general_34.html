        "그 사람은 사실 자신의 행동과 말에 결정을 내리지 못했어요. 관계에 대해 확신이 들기 전까지는 조심스러워 하는 거고, 결정을 내리기 전까지는 당신에 대한 마음과 감정을 계속 표현하려고 할 거예요.",

<style>
:root{
  --cream:#faf5ee; --rose:#c56a7b; --ink:#3a3560; --body:#4e4962; --muted:#9b8fa0;
  --gold:#c9b48f; --pill:#dfb0bb; --btn1:#df93a2; --btn2:#c0687b;
  --hl:rgba(228,168,190,.32);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:"Pretendard","Nanum Myeongjo",sans-serif; color:var(--body);
  background:
    radial-gradient(130% 50% at 84% 6%, #f3e7ee 0%, rgba(243,231,238,0) 52%),
    radial-gradient(90% 40% at 10% 4%, #fbeef0 0%, rgba(251,238,240,0) 58%),
    linear-gradient(180deg, #faf4ee 0%, #f7f0ee 40%, #eef1f7 78%, #e9edf6 100%);
  min-height:100vh;
}
.wrap{max-width:520px; margin:0 auto; padding:30px 22px 48px; position:relative; overflow:hidden;}

/* 배경 장식 */
.deco{position:absolute; z-index:0; pointer-events:none; user-select:none;}
.deco.moon{top:-14px; right:-16px; width:172px;}
.deco.gl{bottom:-6px; left:-14px; width:158px;}
.deco.gr{bottom:-6px; right:-14px; width:150px;}
.wrap > section{position:relative; z-index:1;}

/* 브랜드 바 */
.brand{display:flex; align-items:center; justify-content:center; gap:11px; color:var(--rose);}
.brand .nm{font-family:"Nanum Myeongjo",serif; font-weight:800; letter-spacing:.06em; font-size:19px; color:#c07a86;}
.brand .dia{color:var(--pill); font-size:11px;}
.moonicon{width:23px; height:23px; display:block;}

/* 타이틀 */
.title{text-align:center; margin:24px 0 0; line-height:1.14;}
.title span{display:block; font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:clamp(40px,12vw,48px); letter-spacing:.005em;}
.title span{font-size:clamp(32px,9.5vw,44px); word-break:keep-all;} /* 긴 제목 한 줄 유지 */
.title .rose{color:var(--rose);}
.title .ink{color:var(--ink);}
.divider{display:flex; align-items:center; justify-content:center; gap:9px; margin:18px 0; color:var(--pill);}
.divider::before,.divider::after{content:""; height:1px; width:52px; background:linear-gradient(90deg,transparent,#d9b9c1);}
.divider::after{background:linear-gradient(90deg,#d9b9c1,transparent);}
.divider .d{font-size:12px;}

.sub{text-align:center;}
.sub .s1{font-family:"Pretendard"; font-weight:700; font-size:22px; color:var(--ink); letter-spacing:-.01em; word-break:keep-all;}
.sub .s2{font-size:14.5px; color:var(--muted); margin-top:9px; letter-spacing:.02em;}

/* 선택 화면 카드 패널 */
.panel{
  margin:28px 0 0; padding:26px 16px 22px; border-radius:30px;
  background:linear-gradient(180deg,#e7eff8,#eef2fb);
  box-shadow:0 16px 38px -20px rgba(90,80,120,.42), inset 0 0 0 1px rgba(255,255,255,.55);
}
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:end;}
.card{cursor:pointer; border:none; background:transparent; padding:0; margin:0; display:flex; flex-direction:column; align-items:center; gap:14px;}
.card img{width:100%; height:auto; display:block; border-radius:10px;
  filter:drop-shadow(0 9px 15px rgba(80,70,110,.42)); transition:transform .18s ease, filter .18s ease;}
.card .pill{font-family:"Nanum Myeongjo",serif; font-size:15.5px; color:#b06b79; padding:4px 10px; white-space:nowrap;
  border:1px solid var(--pill); border-radius:22px; background:rgba(255,255,255,.55); letter-spacing:.04em;}
.card .pill::before,.card .pill::after{content:"✦"; font-size:9px; color:var(--pill); margin:0 4px; vertical-align:2px;}
.card:hover img{transform:translateY(-3px);}
.card[aria-pressed="true"] img{transform:translateY(-6px) scale(1.03); filter:drop-shadow(0 14px 20px rgba(197,106,123,.6));}
.card[aria-pressed="true"] .pill{background:var(--rose); color:#fff; border-color:var(--rose);}
.card[aria-pressed="true"] .pill::before,.card[aria-pressed="true"] .pill::after{color:#ffd9e2;}

/* 핑크 하이라이트 / 훅 */
.hl{text-align:center; margin:28px auto 0; font-size:16.5px; color:#a85f70; line-height:1.65; font-weight:600; max-width:360px; word-break:keep-all;}
.hl b{background:linear-gradient(180deg,transparent 55%,var(--hl) 55%); padding:0 3px; font-weight:600;}

/* 버튼 */
.cta{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; margin:20px 0 0;
  padding:19px 22px; border:none; cursor:pointer; font-family:"Pretendard"; font-weight:700; font-size:18.5px;
  color:#fff; letter-spacing:.01em; border-radius:34px; background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 14px 26px -10px rgba(192,104,123,.7); transition:filter .15s ease, transform .1s ease;}
.cta:disabled{filter:grayscale(.35) opacity(.55); cursor:default; box-shadow:none;}
.cta:not(:disabled):active{transform:translateY(1px);}
.cta .arw{font-size:16px; opacity:.9;}

/* 하단 브랜드 */
.foot{margin:38px 0 0; text-align:center;}
.foot .en{margin-top:13px; font-family:"Pretendard"; font-size:11px; letter-spacing:.34em; color:#c9aeb8;}

/* ===== 결과 화면: 카드 + 화환 ===== */
.stage{position:relative; display:flex; justify-content:center; align-items:flex-start; min-height:480px; margin-top:20px;}
.revealcard{position:relative; z-index:3; width:258px; max-width:66%; border-radius:12px; filter:drop-shadow(0 18px 30px rgba(80,70,110,.5));}
.wreath{position:absolute; z-index:1; top:30px; width:158px; pointer-events:none; opacity:.95;}
.wl{left:50%; margin-left:-248px;}
.wr{left:50%; margin-left:90px; transform:scaleX(-1);}
.orbit{position:absolute; z-index:0; left:50%; transform:translateX(-50%); border-radius:50%; border:1px solid rgba(201,180,143,.38);}
.o1{width:352px; height:352px; top:40px;}
.o2{width:300px; height:300px; top:66px; border-color:rgba(201,180,143,.28);}
.glow{position:absolute; z-index:0; left:50%; top:14px; width:310px; height:420px; transform:translateX(-50%);
  background:radial-gradient(ellipse at center, rgba(255,247,240,.92) 0%, rgba(242,232,246,.35) 55%, transparent 72%); border-radius:50%;}

.reveal .rpill{font-family:"Nanum Myeongjo",serif; font-size:16.5px; color:#b06b79; margin:4px auto 0; display:table;
  padding:5px 26px; border:1px solid var(--pill); border-radius:22px; background:rgba(255,255,255,.62); letter-spacing:.05em;}
.reveal .rpill::before,.reveal .rpill::after{content:"✦"; font-size:10px; color:var(--pill); margin:0 8px; vertical-align:2px;}

.reading{margin:22px 2px 0; padding:28px 22px; border-radius:24px;
  background:linear-gradient(180deg, rgba(231,239,248,.6), rgba(239,242,251,.4));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
.reading .quote{font-family:"Nanum Myeongjo",serif; font-weight:700; font-size:18.5px; color:var(--ink);
  text-align:center; line-height:1.6; margin:0 0 20px; word-break:keep-all;}
.reading p{font-size:16.5px; line-height:1.9; color:var(--body); margin:0; text-align:center; letter-spacing:-.01em; word-break:keep-all;}
.rsep{display:flex; justify-content:center; align-items:center; margin:16px 0; color:var(--pill);}
.rsep::before,.rsep::after{content:""; height:1px; width:44px; background:#e2c3cb;}
.rsep .d{font-size:10px; margin:0 11px;}

.repick{display:block; width:100%; text-align:center; margin:20px 0 0; background:none; border:none; cursor:pointer;
  font-family:"Pretendard"; font-size:14.5px; color:#9a8fa0; letter-spacing:.01em;
  text-decoration:underline; text-underline-offset:4px; text-decoration-color:#d4c2cc;}

/* 선택 화면만 세로 간격 넓힘 (카드 비율·크기는 그대로) */
#screenPick .title{margin-top:36px;}
#screenPick .divider{margin:28px 0;}
#screenPick .sub .s2{margin-top:12px;}
#screenPick .panel{margin-top:44px; padding:44px 18px 36px;}
#screenPick .cards{gap:18px;}
#screenPick .hl{margin-top:46px;}
#screenPick .cta{margin-top:32px;}
#screenPick .foot{margin-top:58px;}

/* 화면 전환 */
.screen{display:none;}
.screen.active{display:block; animation:fade .45s ease;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* 옆 여백 장식 (넓은 화면) */
.side{position:absolute; top:150px; color:#d9b6c0; pointer-events:none; display:none; z-index:1;}
.side.l{left:-120px; width:112px; font-family:"Parisienne",cursive; font-size:27px; line-height:1.5; text-align:right; color:#e0aeba;}
.side.r{right:-112px; width:104px; font-size:13.5px; line-height:2; color:#c99faa; text-align:left;}
@media(min-width:1000px){ .side{display:block;} }

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>

      </div>
      <div class="rpill" id="revealPill"></div>
      <div class="reading" id="readingBox"></div>
    </div>

    <p class="hl" id="resultHl"></p>
    <button class="cta" id="bookBtn"><span id="bookTxt"></span><span class="arw">›</span></button>
    <button class="repick" id="repick">다른 카드도 궁금하면 · 다시 고르기</button>

    <div class="foot">
      <div class="brand">
        <span class="dia">✦</span>
        <svg class="moonicon" viewBox="0 0 24 24"><path d="M17 3.5A9 9 0 1 0 20.5 15 7 7 0 0 1 17 3.5Z" fill="#e6a9b4"/></svg>
        <span class="nm">가인타로</span>
        <span class="dia">✦</span>
      </div>
      <div class="en">TAROT BRINGS A KINDER TOMORROW</div>
    </div>
  </section>

</div>

<script>
(function(){
  const C=CONFIG, $=s=>document.querySelector(s); let selected=null;
  $("#tRose").textContent=$("#tRose2").textContent=C.titleRose;
  $("#tInk").textContent=$("#tInk2").textContent=C.titleInk;
  $("#subA").textContent=$("#subB").textContent=C.subtitle;
  $("#subnoteA").textContent=$("#subnoteB").textContent=C.subnote;
  $("#pickCta").innerHTML="<b>"+C.pickCta+"</b>";
  $("#pickBtnTxt").textContent=C.pickBtn;
  $("#bookTxt").textContent=C.bookingCta;
  if(!C.allowRepick) $("#repick").style.display="none";

  const row=$("#cardRow");
  C.cards.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="card"; b.type="button"; b.setAttribute("aria-pressed","false");
    b.setAttribute("aria-label",c.label+" 카드 선택");
    b.innerHTML='<img src="'+C.cardBack+'" alt="'+c.label+' 카드"><span class="pill"></span>';
    b.querySelector(".pill").textContent=c.label;
    b.addEventListener("click",()=>select(i,b));
    row.appendChild(b);
  });
  function select(i,btn){
    selected=i;
    document.querySelectorAll(".card").forEach(el=>el.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true"); $("#goResult").disabled=false;
  }
  $("#goResult").addEventListener("click",()=>{
    if(selected===null) return;
    const c=C.cards[selected];
    $("#revealImg").src=c.img; $("#revealPill").textContent=c.label;
    const box=$("#readingBox"); box.innerHTML="";
    if(c.quote){const q=document.createElement("div"); q.className="quote"; q.textContent="💭 “"+c.quote+"”"; box.appendChild(q);}
    c.body.forEach((para,idx)=>{
      const p=document.createElement("p"); p.textContent=para; box.appendChild(p);
      if(idx<c.body.length-1){const s=document.createElement("div"); s.className="rsep"; s.innerHTML='<span class="d">◆</span>'; box.appendChild(s);}
    });
    $("#resultHl").innerHTML="<b>👉 "+c.hook+"</b>";
    $("#screenPick").classList.remove("active"); $("#screenResult").classList.add("active");
    window.scrollTo({top:0});
  });
  $("#bookBtn").addEventListener("click",()=>window.open(C.bookingUrl,"_blank","noopener"));
  $("#repick").addEventListener("click",()=>{
    selected=null; $("#goResult").disabled=true;
    document.querySelectorAll(".card").forEach(el=>el.setAttribute("aria-pressed","false"));
    $("#screenResult").classList.remove("active"); $("#screenPick").classList.add("active"); window.scrollTo({top:0});
  });
})();
</script>
